<style>
:root{--bg:#faf8fa;--card:#fff;--ink:#222;--mute:#6b6470;--line:#e6dfe5;--brand:#8a1c4a;--teal:#0b8a9a;--soft:#f3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131a;--card:#221c26;--ink:#f1ecf3;--mute:#a79eb0;--line:#382f3d;--brand:#e0679a;--teal:#4fc3d1;--soft:#33222c}}
:root[data-theme="dark"]{--bg:#17131a;--card:#221c26;--ink:#f1ecf3;--mute:#a79eb0;--line:#382f3d;--brand:#e0679a;--teal:#4fc3d1;--soft:#33222c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:1.3rem;color:var(--brand)}header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
nav{display:flex;gap:6px;padding:10px 20px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:900px;margin:0 auto;padding:8px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:4px 0}.mute{color:var(--mute);font-size:.9rem}
.tag{display:inline-block;background:var(--soft);color:var(--brand);font-size:.78rem;padding:2px 10px;border-radius:99px;margin-right:4px}
.btn{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}
.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
form{display:grid;gap:10px;max-width:480px}label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stats div{background:var(--soft);border-radius:10px;padding:10px 18px;text-align:center}.stats b{display:block;font-size:1.5rem;color:var(--teal)}
.stamp{border-left:4px solid var(--teal);padding:10px 14px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.pass{border:2px solid var(--brand);border-radius:16px;padding:20px;background:var(--card)}
.empty{color:var(--mute);padding:20px 0}
.hero{padding:34px 0 10px}.hero h2{font-size:2rem;line-height:1.2;margin:0 0 10px;color:var(--brand)}.hero p{font-size:1.05rem;max-width:640px}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sdg{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:2px 10px;font-size:.8rem;margin:2px 4px 2px 0}.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--soft);padding:4px 10px;border-radius:6px}.lvl{font-weight:700;color:var(--teal)}.map{width:100%;height:auto;max-height:380px}.map text{fill:var(--ink);font-size:11px}.crit{border-left:4px solid var(--brand);padding:8px 14px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}@media print{header,nav,.noprint{display:none}}
</style>
</head>
