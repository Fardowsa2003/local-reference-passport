<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Local Reference Passport – Track 3</title>
<style>
:root{--bg:#faf8fa;--card:#fff;--ink:#222;--mute:#6b6470;--line:#e6dfe5;--brand:#8a1c4a;--teal:#0b8a9a;--soft:#f3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131a;--card:#221c26;--ink:#f1ecf3;--mute:#a79eb0;--line:#382f3d;--brand:#e0679a;--teal:#4fc3d1;--soft:#33222c}}
:root[data-theme="dark"]{--bg:#17131a;--card:#221c26;--ink:#f1ecf3;--mute:#a79eb0;--line:#382f3d;--brand:#e0679a;--teal:#4fc3d1;--soft:#33222c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:1.3rem;color:var(--brand)}header p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
nav{display:flex;gap:6px;padding:10px 20px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:900px;margin:0 auto;padding:8px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:4px 0}.mute{color:var(--mute);font-size:.9rem}
.tag{display:inline-block;background:var(--soft);color:var(--brand);font-size:.78rem;padding:2px 10px;border-radius:99px;margin-right:4px}
.btn{background:var(--brand);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}
.btn.alt{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn:disabled{opacity:.5;cursor:default}
form{display:grid;gap:10px;max-width:480px}label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stats div{background:var(--soft);border-radius:10px;padding:10px 18px;text-align:center}.stats b{display:block;font-size:1.5rem;color:var(--teal)}
.stamp{border-left:4px solid var(--teal);padding:10px 14px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}
.pass{border:2px solid var(--brand);border-radius:16px;padding:20px;background:var(--card)}
.empty{color:var(--mute);padding:20px 0}
.hero{padding:34px 0 10px}.hero h2{font-size:2rem;line-height:1.2;margin:0 0 10px;color:var(--brand)}.hero p{font-size:1.05rem;max-width:640px}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sdg{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:2px 10px;font-size:.8rem;margin:2px 4px 2px 0}.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--soft);padding:4px 10px;border-radius:6px}.lvl{font-weight:700;color:var(--teal)}.map{width:100%;height:auto;max-height:380px}.map text{fill:var(--ink);font-size:11px}.crit{border-left:4px solid var(--brand);padding:8px 14px;margin:10px 0;background:var(--card);border-radius:0 10px 10px 0}@media print{header,nav,.noprint{display:none}}
</style>
</head>
<body>
<header><h1>🛂 Local Reference Passport</h1><p>Do real local work. Earn real local references. Show them to any employer.</p></header>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var KEY="lrp_v2";
var SEED=[
 {id:1,title:"Translate a clinic leaflet (Arabic/French to English)",biz:"CareBridge Clinic",skills:"translation, languages",hours:3,pay:"KES 2,500"},
 {id:2,title:"Build a simple price list in Excel",biz:"Mama Njeri Groceries",skills:"excel, data entry",hours:4,pay:"KES 3,000"},
 {id:3,title:"Design a flyer for a weekend market",biz:"Kawangware Market Assoc.",skills:"design, canva",hours:3,pay:"KES 2,000"},
 {id:4,title:"Fix a small website contact form",biz:"BrightPath Tutors",skills:"html, javascript, web",hours:5,pay:"KES 4,500"},
 {id:5,title:"First aid refresher session for staff",biz:"BuildRight Kenya",skills:"nursing, first aid",hours:2,pay:"KES 3,500"}
];
var S=load();
function fresh(){return {profile:null,tasks:SEED.slice(),mine:[],nextId:6,view:"home"}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mineFor(id){return S.mine.filter(function(m){return m.taskId===id})[0]}
function task(id){return S.tasks.filter(function(t){return t.id===id})[0]}
function go(v){S.view=v;save();render();window.scrollTo(0,0)}
function skills(str){return String(str).split(",").map(function(s){return '<span class="tag">'+esc(s.trim())+'</span>'}).join("")}
function done(){return S.mine.filter(function(m){return m.status==="endorsed"})}

function render(){
  var tabs=[["home","Home"],["tasks","Micro-tasks"],["mine","My work"],["biz","Businesses"],["pass","My passport"],["coach","AI Coach"],["about","Impact"]];
  document.getElementById("nav").innerHTML=tabs.map(function(t){return '<button class="'+(S.view===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
  var v=S.view,h="";
  if(v==="home")h=homeView();
  else if(v==="biz")h=bizView();
  else if(v==="about")h=aboutView();
  else if(v==="coach")h=coachView();
  else if(!S.profile)h=profileForm();
  else if(v==="tasks")h=tasksView();
  else if(v==="mine")h=mineView();
  else h=passView();
  document.getElementById("app").innerHTML=h;
}
function homeView(){
  return '<div class="hero"><p><span class="sdg">SDG 8</span><span class="sdg">SDG 10</span><span class="sdg">SDG 17</span></p>'+
  '<h2>Skilled refugees do not lack talent. They lack a local reference.</h2>'+
  '<p>Employers ask for local experience, but you cannot get it without a job. The Local Reference Passport breaks that loop: do small paid tasks for neighbourhood businesses, earn a signed reference each time, and build a verified local network employers can trust.</p>'+
  '<div class="btnrow"><button class="btn" onclick="go(\'tasks\')">Start my passport</button><button class="btn alt" onclick="demo()">Load demo journey</button></div></div>'+
  '<div class="grid"><div class="card"><h3>1. Work</h3><p class="mute">Take paid micro-tasks matched to your skills.</p></div>'+
  '<div class="card"><h3>2. Get endorsed</h3><p class="mute">Businesses vouch for you and can offer a warm introduction.</p></div>'+
  '<div class="card"><h3>3. Show proof</h3><p class="mute">Share a passport with a verification code and a live network map.</p></div></div>';
}
function demo(){
  S=fresh();
  S.profile={name:"Amina Hassan",prof:"Registered Nurse",skills:"nursing, first aid, languages, translation",country:"Somalia"};
  S.mine=[
   {taskId:1,status:"endorsed",note:"Accurate, clear and finished a day early. Our patients now understand the leaflet.",by:"Dr. Wanjiru, CareBridge Clinic",date:"12/11/2026",intro:"Head nurse at Kenyatta Hospital"},
   {taskId:5,status:"endorsed",note:"Calm, professional trainer. Staff asked for a second session.",by:"Peter Otieno, BuildRight Kenya",date:"18/11/2026",intro:"Safety officer at a partner construction firm"},
   {taskId:2,status:"requested",note:"",by:"",date:"",intro:""}];
  S.view="pass";save();render();
}
function profileForm(){
  return '<h2>Start your passport</h2><form onsubmit="return saveProfile(this)">'+
  '<label>Full name<input name="name" required></label>'+
  '<label>Profession / background<input name="prof" placeholder="e.g. Nurse, Teacher, Developer" required></label>'+
  '<label>Skills (comma separated)<input name="skills" placeholder="excel, translation, design" required></label>'+
  '<label>Home country (optional)<input name="country"></label>'+
  '<button class="btn">Create my passport</button></form>';
}
function saveProfile(f){
  S.profile={name:f.name.value.trim(),prof:f.prof.value.trim(),skills:f.skills.value.trim(),country:f.country.value.trim()};
  S.view="tasks";save();render();return false;
}
function fit(t){
  var mine=S.profile.skills.toLowerCase().split(",").map(function(s){return s.trim()});
  return t.skills.toLowerCase().split(",").map(function(s){return s.trim()}).filter(function(s){return mine.indexOf(s)>-1}).length;
}
function tasksView(){
  var list=S.tasks.slice().sort(function(a,b){return fit(b)-fit(a)});
  var h='<h2>Paid micro-tasks from local businesses</h2><p class="mute">Small jobs, real pay, and a reference when you finish. Best skill matches come first.</p><div class="grid">';
  list.forEach(function(t){
    var m=mineFor(t.id),f=fit(t);
    h+='<div class="card"><h3>'+esc(t.title)+'</h3><p class="mute">'+esc(t.biz)+' · about '+t.hours+' hrs · '+esc(t.pay)+'</p><p>'+skills(t.skills)+'</p>'+
    (f?'<p class="mute">✓ You match '+f+' skill'+(f>1?"s":"")+'</p>':"")+
    (m?'<button class="btn" disabled>Taken</button>':'<button class="btn" onclick="take('+t.id+')">Take this task</button>')+'</div>';
  });
  return h+'</div>';
}
function take(id){S.mine.push({taskId:id,status:"doing",note:"",by:"",date:"",intro:""});S.view="mine";save();render()}
function mineView(){
  if(!S.mine.length)return '<h2>My work</h2><p class="empty">No tasks yet. Pick one from Micro-tasks.</p>';
  var h='<h2>My work</h2><div class="grid">';
  S.mine.forEach(function(m){
    var t=task(m.taskId);if(!t)return;
    var st={doing:"In progress",requested:"Waiting for endorsement",endorsed:"Endorsed ✓"}[m.status];
    h+='<div class="card"><span class="tag">'+st+'</span><h3>'+esc(t.title)+'</h3><p class="mute">'+esc(t.biz)+'</p>'+
    (m.status==="doing"?'<button class="btn" onclick="finish('+t.id+')">Mark done and request endorsement</button>':"")+
    (m.status==="requested"?'<p class="mute">Ask '+esc(t.biz)+' to open the Businesses tab and endorse you.</p>':"")+
    (m.status==="endorsed"?'<p>“'+esc(m.note)+'”</p><p class="mute">— '+esc(m.by)+', '+esc(m.date)+'</p>':"")+'</div>';
  });
  return h+'</div>';
}
function finish(id){mineFor(id).status="requested";save();render()}
function bizView(){
  var h='<h2>For businesses</h2><p class="mute">Post a small task, endorse the people who complete it, and open your network to them.</p>';
  var pend=S.mine.filter(function(m){return m.status==="requested"});
  h+='<h3>Endorsements waiting ('+pend.length+')</h3>';
  if(!pend.length)h+='<p class="empty">Nothing waiting.</p>';
  pend.forEach(function(m){
    var t=task(m.taskId);
    h+='<div class="card" style="margin-bottom:12px"><b>'+esc(t.title)+'</b><p class="mute">Completed by '+esc(S.profile?S.profile.name:"a job seeker")+' for '+esc(t.biz)+'</p>'+
    '<form onsubmit="return endorse(event,'+t.id+')"><label>Your reference note<textarea name="note" rows="2" required placeholder="Reliable, delivered on time…"></textarea></label>'+
    '<label>Your name and role<input name="by" required placeholder="Jane Mwangi, Owner"></label>'+
    '<label>I can introduce them to (optional)<input name="intro" placeholder="e.g. HR manager at a partner hospital"></label><button class="btn">Endorse</button></form></div>';
  });
  h+='<h3 style="margin-top:24px">Post a new micro-task</h3><form onsubmit="return addTask(this)">'+
  '<label>Task<input name="title" required></label><label>Business name<input name="biz" required></label>'+
  '<label>Skills needed (comma separated)<input name="skills" required></label>'+
  '<label>Hours<input name="hours" type="number" min="1" value="3"></label><label>Pay<input name="pay" placeholder="KES 3,000"></label>'+
  '<button class="btn">Post task</button></form>';
  return h;
}
function endorse(e,id){
  var f=e.target,m=mineFor(id);
  m.status="endorsed";m.note=f.note.value.trim();m.by=f.by.value.trim();m.intro=f.intro.value.trim();m.date=new Date().toLocaleDateString();
  save();render();return false;
}
function addTask(f){
  S.tasks.unshift({id:S.nextId++,title:f.title.value.trim(),biz:f.biz.value.trim(),skills:f.skills.value.trim(),hours:+f.hours.value||3,pay:f.pay.value.trim()||"Negotiable"});
  save();S.view="tasks";render();return false;
}
function vcode(){
  var str=S.profile.name+done().map(function(m){return m.taskId+m.by}).join("|"),n=7;
  for(var i=0;i<str.length;i++)n=(n*31+str.charCodeAt(i))%1679616;
  return "LRP-"+("0000"+n.toString(36).toUpperCase()).slice(-4)+"-"+String(done().length).padStart(2,"0");
}
function netMap(){
  var d=done(),W=560,H=330,cx=W/2,cy=H/2,out='<svg class="map" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Local network map">';
  var n=d.length;
  d.forEach(function(m,i){
    var a=(i/Math.max(n,1))*Math.PI*2-Math.PI/2,x=cx+Math.cos(a)*120,y=cy+Math.sin(a)*100;
    out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="var(--teal)" stroke-width="2"/>';
    if(m.intro){var x2=cx+Math.cos(a)*215,y2=cy+Math.sin(a)*140;
      out+='<line x1="'+x+'" y1="'+y+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--brand)" stroke-dasharray="4 3"/><circle cx="'+x2+'" cy="'+y2+'" r="7" fill="none" stroke="var(--brand)" stroke-width="2"/><text x="'+x2+'" y="'+(y2+(y2>cy?20:-12))+'" text-anchor="middle">'+esc(m.intro.slice(0,26))+'</text>';}
    out+='<circle cx="'+x+'" cy="'+y+'" r="13" fill="var(--teal)"/><text x="'+x+'" y="'+(y+(y>cy?28:-20))+'" text-anchor="middle">'+esc(task(m.taskId).biz.slice(0,22))+'</text>';
  });
  out+='<circle cx="'+cx+'" cy="'+cy+'" r="26" fill="var(--brand)"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" style="fill:#fff;font-weight:700">You</text></svg>';
  return out;
}
function passView(){
  var p=S.profile,d=done(),biz={};d.forEach(function(m){biz[task(m.taskId).biz]=1});
  var hrs=d.reduce(function(a,m){return a+task(m.taskId).hours},0),intros=d.filter(function(m){return m.intro}).length;
  var lvl=d.length>=3?"Trusted":d.length>=1?"Rising":"Starter";
  var h='<div class="pass"><p class="mute" style="margin:0">LOCAL REFERENCE PASSPORT · Verification <span class="code">'+vcode()+'</span></p>'+
  '<h2 style="margin:6px 0 0">'+esc(p.name)+'</h2><p class="mute">'+esc(p.prof)+(p.country?' · from '+esc(p.country):"")+' · Trust level: <span class="lvl">'+lvl+'</span></p><p>'+skills(p.skills)+'</p>'+
  '<div class="stats"><div><b>'+d.length+'</b>Verified jobs</div><div><b>'+Object.keys(biz).length+'</b>Local references</div><div><b>'+hrs+'</b>Work hours</div><div><b>'+intros+'</b>Warm intros</div></div>'+
  '<h3>My local network</h3>'+(d.length?netMap():'<p class="empty">Your network map grows with every endorsement.</p>')+
  '<h3>Verified local experience</h3>';
  if(!d.length)h+='<p class="empty">Complete and get endorsed on a task to add your first stamp.</p>';
  d.forEach(function(m){var t=task(m.taskId);
    h+='<div class="stamp"><b>'+esc(t.title)+'</b><div class="mute">'+esc(t.biz)+' · '+t.hours+' hrs</div><div>“'+esc(m.note)+'”</div><div class="mute">— '+esc(m.by)+', '+esc(m.date)+'</div>'+(m.intro?'<div class="mute">🤝 Offers introduction: '+esc(m.intro)+'</div>':"")+'</div>'});
  h+='</div><p class="noprint" style="margin-top:14px"><button class="btn" onclick="window.print()">Print or save as PDF</button> <button class="btn alt" onclick="resetAll()">Reset</button></p>';
  return h;
}
function coachBg(){
  var p=S.profile;if(!p)return "";
  var t="Profession: "+p.prof+"\nSkills: "+p.skills+(p.country?"\nFrom: "+p.country:"");
  var d=done();if(d.length)t+="\nLocal experience:\n"+d.map(function(m){var k=task(m.taskId);return "- "+k.title+" for "+k.biz+" ("+k.hours+" hrs). Reference: "+m.note}).join("\n");
  return t;
}
function coachView(){
  return '<h2>AI Career Coach</h2><p class="mute">Turn your background and passport into a local-format CV, or practise the interview. Powered by Claude.</p>'+
  '<form onsubmit="return false"><label>Target role<input id="cRole" placeholder="e.g. Nurse at a private clinic in Nairobi"></label>'+
  '<label>Your background<textarea id="cBg" rows="7" placeholder="Describe your education, past jobs and skills">'+esc(coachBg())+'</textarea></label>'+
  '<div class="btnrow"><button type="button" class="btn" onclick="runCoach(\'cv\')">Localize my CV</button><button type="button" class="btn alt" onclick="runCoach(\'int\')">Practise interview</button></div></form>'+
  '<div id="cOut" class="card" style="white-space:pre-wrap;display:none;margin-top:12px"></div>';
}
async function runCoach(mode){
  var role=document.getElementById("cRole").value.trim()||"a suitable professional role",bg=document.getElementById("cBg").value.trim();
  var out=document.getElementById("cOut");out.style.display="block";
  if(!bg){out.textContent="Please add your background first.";return}
  out.textContent="Thinking…";
  var base="You are a warm, practical career coach helping a skilled refugee professional find work in Nairobi, Kenya. Use simple English. Never invent facts: if something is missing, write [add detail]. Plain text only, no markdown symbols.\nTarget role: "+role+"\nCandidate background:\n"+bg+"\n\n";
  var ask=mode==="cv"?"Task: rewrite this into a clear one-page CV in the Kenyan format (profile summary, key skills, experience with achievement bullets, education, referees). Treat the local experience and references as proof of local work. Then give 3 short tips on how to explain foreign qualifications to Kenyan employers.":"Task: give 5 likely interview questions for this role in Kenya. For each, give a short outline of a strong answer using the candidate's real background. Finish with 2 smart questions the candidate can ask the employer.";
  var sample=null;try{if(window.claude)sample=await window.claude.use("sample")}catch(e){}
  if(!sample){out.textContent="The AI coach works when this page is opened from its Claude link.";return}
  try{await sample(base+ask,{onText:function(r){out.textContent=r.text}})}
  catch(e){out.textContent=(e&&e.code==="not_granted")?"Permission was declined, so the coach is switched off.":"The coach is busy right now. Please try again in a moment."}
}
function aboutView(){
  var c=[["Credential and skills verification","Every stamp is a real task signed by a local business, plus a unique verification code on the passport."],
  ["Access and compliance readiness","Paid micro-tasks give a safe first step before full work authorization, with a clear record of hours and pay."],
  ["Practical and market fit","Tasks are posted by neighbourhood employers and ranked by the person’s actual skills."],
  ["Social and SDG impact","SDG 8 decent work, SDG 10 reduced inequalities, SDG 17 partnerships between refugees and local businesses."],
  ["Sustainability and scalability","Zero heavy overhead: any city, sector or NGO can run it. Businesses self-serve, and each endorsement opens new introductions."]];
  var h='<h2>Why this works (Track 3)</h2><p class="mute">The “local experience” gap is really a trust gap. This project turns work into proof and proof into network.</p>';
  c.forEach(function(x,i){h+='<div class="crit"><b>'+(i+1)+'. '+x[0]+'</b><div class="mute">'+x[1]+'</div></div>'});
  return h+'<h3>What makes it different</h3><p>Most platforms match people to jobs. This one builds the missing asset itself: portable, verifiable local references and a visible network, so the person owns their proof.</p>';
}
function resetAll(){if(confirm("Clear everything and start over?")){try{localStorage.removeItem(KEY)}catch(e){}S=fresh();render()}}
render();
</script>
</body>
</html>
